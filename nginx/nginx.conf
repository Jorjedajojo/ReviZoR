# ReviZoR FranK — Nginx reverse proxy configuration
#
# Routes:
#   /api/*          → FastAPI auth server (port 8000)
#   /*              → Streamlit app (port 8501)
#
# Security headers, rate limiting, HTTPS redirect, and WebSocket
# support for Streamlit are all configured here.
#
# Place your SSL certificate at:
#   nginx/certs/revizor.crt
#   nginx/certs/revizor.key
#
# For Let's Encrypt, use Certbot and mount /etc/letsencrypt instead.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20M;   # Allow CV uploads up to 20MB

    # ── Rate limiting zones ────────────────────────────────────────────────────
    # Strict limit on auth endpoints: 10 req/min per IP
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    # General API limit: 60 req/min per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    # ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;   # Replace with your actual domain

        # ── TLS ────────────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/certs/revizor.crt;
        ssl_certificate_key /etc/nginx/certs/revizor.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Security headers ───────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss: ws:;"
            always;

        # ── API routes (FastAPI) ──────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Strict rate limit on login ────────────────────────────────────────
        location /api/auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Streamlit WebSocket (required for Streamlit to function) ──────────
        location /_stcore/stream {
            proxy_pass         http://app:8501/_stcore/stream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;   # Long-lived WebSocket
        }

        # ── Streamlit app (all other routes) ─────────────────────────────────
        location / {
            proxy_pass         http://app:8501;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
